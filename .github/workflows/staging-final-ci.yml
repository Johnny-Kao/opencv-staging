name: Staging final CI (production-equivalent)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact opencv-staging candidate SHA to validate
        required: true
        type: string
        default: cd98224bc69b1b6dea539e4099237da7aebf0060

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  OPENCV_TEST_DATA_PATH: ${{ github.workspace }}/opencv_extra/testdata

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            extra_cmake: "-DWITH_OPENCL=OFF"
          - arch: x86_64
            runner: macos-26-intel
            extra_cmake: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check 99eb7ceb8896ed5f5cdf2e9f9cf52132a2a8d5a0 "$CANDIDATE_SHA"
          test "$(git diff --name-only 99eb7ceb8896ed5f5cdf2e9f9cf52132a2a8d5a0 "$CANDIDATE_SHA" | sort)" = "$(printf '%s\n' modules/videoio/src/cap_avfoundation_mac.mm modules/videoio/test/test_video_io.cpp | sort)"
          uname -a
          uname -m
          sw_vers
          xcodebuild -version

      - name: Checkout opencv_extra
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv_extra
          ref: 5.x
          path: opencv_extra
          fetch-depth: 1

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_PERF_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DOPENCV_ENABLE_NONFREE=ON \
            -DBUILD_ZLIB=OFF \
            ${{ matrix.extra_cmake }}

      - name: Full build
        run: cmake --build build -j 3

      - name: videoio accuracy
        run: ./build/bin/opencv_test_videoio --skip_unstable=1

      - name: videoio perf sanity
        run: ./build/bin/opencv_perf_videoio --perf_impl=plain --perf_min_samples=1 --perf_force_samples=1 --perf_verify_sanity --skip_unstable=1

  linux-guard:
    name: Linux x64 guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check 99eb7ceb8896ed5f5cdf2e9f9cf52132a2a8d5a0 "$CANDIDATE_SHA"

      - name: Checkout opencv_extra
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv_extra
          ref: 5.x
          path: opencv_extra
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=ON \
            -DOPENCV_ENABLE_NONFREE=ON

      - name: Full build
        run: cmake --build build -j 3

      - name: videoio accuracy
        run: ./build/bin/opencv_test_videoio --skip_unstable=1
